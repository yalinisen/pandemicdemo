// Wong colorblind-safe palette
var COLOR_PALETTE = [
  {hex:'#f0f0ec', label:'Default'},
  {hex:'#E69F00', label:'Orange'},
  {hex:'#56B4E9', label:'Sky blue'},
  {hex:'#009E73', label:'Bluish green'},
  {hex:'#F0E442', label:'Yellow'},
  {hex:'#0072B2', label:'Blue'},
  {hex:'#D55E00', label:'Vermillion'},
  {hex:'#CC79A7', label:'Reddish purple'},
  {hex:'#999999', label:'Gray'},
];

var FONT_SIZES = {sm:'10px', md:'12px', lg:'14px'};

function makeTileShell(canvas, tile) {
  var div = document.createElement('div');
  div.className = 'tile';
  div.id = 'tile-' + tile.id;
  div.setAttribute('data-tile-id', tile.id);

  var col = tile.col || 0;
  var row = tile.row || 0;
  var colSpan = tile.colSpan || 1;
  var rowSpan = tile.rowSpan || 4;
  var w = spanToW(colSpan);
  var h = tile.collapsed ? 28 : spanToH(rowSpan);

  div.style.position = 'absolute';
  div.style.left = colToX(col) + 'px';
  div.style.top = rowToY(row) + 'px';
  div.style.width = w + 'px';
  div.style.height = h + 'px';
  div.style.zIndex = tile._zIndex || '10';

  var headerColor = tile.headerColor || '#f0f0ec';
  var textColor = isLightColor(headerColor) ? '#444' : '#fff';

  var header = document.createElement('div');
  header.className = 'tile-header';
  header.style.background = headerColor;

  var titleSpan = document.createElement('span');
  titleSpan.className = 'tile-title';
  titleSpan.style.color = textColor;
  titleSpan.textContent = tile.title;
  titleSpan.title = 'Double-click to rename';
  titleSpan.style.cursor = 'text';
  titleSpan.addEventListener('dblclick', function(e) {
    e.stopPropagation();
    var input = document.createElement('input');
    input.type = 'text';
    input.value = tile.title;
    input.style.cssText = 'font-size:11px;font-weight:600;border:none;border-bottom:2px solid #2980b9;background:transparent;color:' + textColor + ';width:100%;outline:none;padding:0;';
    titleSpan.textContent = '';
    titleSpan.appendChild(input);
    input.focus();
    input.select();
    function commit() {
      var v = input.value.trim() || tile.title;
      tile.title = v;
      var ws = currentWorkspace();
      if (ws && ws.tileInstances[tile.id]) ws.tileInstances[tile.id].title = v;
      saveState();
      titleSpan.textContent = v;
    }
    input.addEventListener('blur', commit);
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      if (e.key === 'Escape') { input.value = tile.title; input.blur(); }
    });
  });
  header.appendChild(titleSpan);

  var metaSpan = document.createElement('span');
  metaSpan.className = 'tile-header-meta';
  if (tile.collapsed && tile.series) {
    var pt = PATIENTS[appState.currentPatient];
    var vals = pt.series[tile.series];
    if (vals) {
      var last = vals[vals.length-1];
      var nr = NORMAL[tile.series];
      var isAbn = nr && (last < nr[0] || last > nr[1]);
      metaSpan.textContent = ' — ' + last.toFixed(1) + (isAbn ? ' ↑' : '');
      metaSpan.style.color = isAbn ? '#c0392b' : '#27ae60';
    }
  }
  header.appendChild(metaSpan);
  header.appendChild(makeTileControls(tile, div, header));

  var body = document.createElement('div');
  body.className = 'tile-body' + (tile.collapsed ? ' tile-body-collapsed' : '');
  if (!tile.collapsed) {
    body.style.height = (h - 30) + 'px';
    body.style.overflow = 'auto';
  }
  if (tile.fontSize) body.style.fontSize = FONT_SIZES[tile.fontSize] || '';

  // Resize handle
  var resizeHandle = document.createElement('div');
  resizeHandle.className = 'resize-handle';
  initTileResize(div, resizeHandle, tile);

  // Overflow hint — shows "▾ more" when content overflows
  var overflowHint = document.createElement('div');
  overflowHint.className = 'tile-overflow-hint';
  // Show only when actually scrollable and not scrolled to bottom
  function updateOverflowHint() {
    var b = div.querySelector('.tile-body');
    if (!b) return;
    var canScroll = b.scrollHeight > b.clientHeight + 4;
    var atBottom = b.scrollTop + b.clientHeight >= b.scrollHeight - 4;
    overflowHint.style.display = (canScroll && !atBottom) ? 'flex' : 'none';
  }
  setTimeout(updateOverflowHint, 300);
  body.addEventListener('scroll', updateOverflowHint);

  div.appendChild(header);
  div.appendChild(body);
  div.appendChild(overflowHint);
  div.appendChild(resizeHandle);
  canvas.appendChild(div);
  return div;
}

function initTileResize(div, handle, tile) {
  var resizeGhost = document.getElementById('resize-ghost');
  var colLabel = document.getElementById('col-label');
  handle.addEventListener('mousedown', function(e) {
    e.preventDefault(); e.stopPropagation();
    var initSpan = tile.colSpan || 1;
    var initMX = e.clientX;
    resizeGhost.style.left = colToX(tile.col||0) + 'px';
    resizeGhost.style.top = rowToY(tile.row||0) + 'px';
    resizeGhost.style.height = spanToH(tile.rowSpan||4) + 'px';
    resizeGhost.style.width = spanToW(initSpan) + 'px';
    resizeGhost.style.display = 'block';
    function onMove(e) {
      var dx = e.clientX - initMX;
      var newSpan = Math.max(1, Math.min(NUM_COLS - (tile.col||0),
        Math.round((spanToW(initSpan) + dx + COL_GAP) / (colW + COL_GAP))
      ));
      resizeGhost.style.width = spanToW(newSpan) + 'px';
      if (colLabel) { colLabel.textContent = newSpan + ' col' + (newSpan>1?'s':''); colLabel.style.display='block'; }
    }
    function onUp(e) {
      resizeGhost.style.display = 'none';
      if (colLabel) colLabel.style.display = 'none';
      var dx = e.clientX - initMX;
      var newSpan = Math.max(1, Math.min(NUM_COLS - (tile.col||0),
        Math.round((spanToW(initSpan) + dx + COL_GAP) / (colW + COL_GAP))
      ));
      tile.colSpan = newSpan;
      var ws = currentWorkspace();
      if (ws && ws.tileInstances[tile.id]) ws.tileInstances[tile.id].colSpan = newSpan;
      saveState();
      renderCanvas(); // full re-render so content reflows at new width
      document.removeEventListener('mousemove', onMove);
      document.removeEventListener('mouseup', onUp);
    }
    document.addEventListener('mousemove', onMove);
    document.addEventListener('mouseup', onUp);
  });
}

function makeTileControls(tile, tileEl, headerEl) {
  var controls = document.createElement('div');
  controls.className = 'tile-controls';

  // Color dot
  var colorDot = document.createElement('div');
  colorDot.className = 'tile-ctrl-btn color-dot';
  colorDot.style.background = tile.headerColor || '#ccc';
  colorDot.title = 'Set header color';
  colorDot.onclick = function(e) {
    e.stopPropagation();
    toggleColorPalette(tile, tileEl, headerEl, colorDot);
  };
  controls.appendChild(colorDot);

  // Font size
  var fontBtn = document.createElement('button');
  fontBtn.className = 'tile-ctrl-btn';
  fontBtn.textContent = 'A';
  fontBtn.title = 'Font size';
  fontBtn.onclick = function(e) {
    e.stopPropagation();
    toggleFontSizePopup(tile, tileEl, fontBtn);
  };
  controls.appendChild(fontBtn);

  // Share
  var shareBtn = document.createElement('button');
  shareBtn.className = 'tile-ctrl-btn';
  shareBtn.textContent = '⇧';
  shareBtn.title = 'Share this tile';
  shareBtn.onclick = function(e) {
    e.stopPropagation();
    shareTile(tile);
  };
  controls.appendChild(shareBtn);

  // Refresh
  var refreshBtn = document.createElement('button');
  refreshBtn.className = 'tile-ctrl-btn';
  refreshBtn.textContent = '↺';
  refreshBtn.title = 'Refresh';
  refreshBtn.onclick = function(e) {
    e.stopPropagation();
    renderCanvas();
  };
  controls.appendChild(refreshBtn);

  // Collapse/expand
  var collapseBtn = document.createElement('button');
  collapseBtn.className = 'tile-ctrl-btn';
  collapseBtn.textContent = tile.collapsed ? '▼' : '▲';
  collapseBtn.title = tile.collapsed ? 'Expand tile' : 'Collapse tile';
  collapseBtn.onclick = function(e) {
    e.stopPropagation();
    toggleCollapse(tile);
  };
  controls.appendChild(collapseBtn);

  // Fullscreen
  var fsBtn = document.createElement('button');
  fsBtn.className = 'tile-ctrl-btn';
  fsBtn.textContent = '⤢';
  fsBtn.title = 'Fullscreen';
  fsBtn.onclick = function(e) {
    e.stopPropagation();
    openFullscreen(tile);
  };
  controls.appendChild(fsBtn);

  // Close
  var closeBtn = document.createElement('button');
  closeBtn.className = 'tile-ctrl-btn close';
  closeBtn.textContent = '×';
  closeBtn.title = 'Remove tile';
  closeBtn.onclick = function(e) {
    e.stopPropagation();
    removeTile(tile.id);
  };
  controls.appendChild(closeBtn);

  return controls;
}

// =====================================================
var openPaletteId = null;

function toggleColorPalette(tile, tileEl, headerEl, dotEl) {
  // Close any open palette
  var existing = document.getElementById('palette-popup-' + tile.id);
  if (existing) { existing.remove(); openPaletteId = null; return; }
  if (openPaletteId) {
    var prev = document.getElementById('palette-popup-' + openPaletteId);
    if (prev) prev.remove();
  }
  openPaletteId = tile.id;

  var popup = document.createElement('div');
  popup.className = 'color-palette';
  popup.id = 'palette-popup-' + tile.id;

  COLOR_PALETTE.forEach(function(c) {
    var swatch = document.createElement('div');
    swatch.className = 'color-swatch' + (tile.headerColor === c.hex ? ' selected' : '');
    swatch.style.background = c.hex;
    swatch.style.border = c.hex === '#f0f0ec' ? '1.5px solid #ccc' : '1.5px solid transparent';
    swatch.title = c.label;
    swatch.onclick = function(e) {
      e.stopPropagation();
      setTileColor(tile, c.hex, tileEl, headerEl, dotEl);
      popup.remove();
      openPaletteId = null;
    };
    popup.appendChild(swatch);
  });

  headerEl.appendChild(popup);

  // Close on outside click
  setTimeout(function() {
    document.addEventListener('click', function closePalette() {
      popup.remove();
      openPaletteId = null;
      document.removeEventListener('click', closePalette);
    }, {once: true});
  }, 10);
}

function setTileColor(tile, hex, tileEl, headerEl, dotEl) {
  tile.headerColor = hex;
  var textColor = isLightColor(hex) ? '#444' : '#fff';
  headerEl.style.background = hex;
  headerEl.querySelectorAll('.tile-title').forEach(function(el) { el.style.color = textColor; });
  if (dotEl) dotEl.style.background = hex;
  var ws = currentWorkspace();
  if (ws.tileInstances[tile.id]) ws.tileInstances[tile.id].headerColor = hex;
  saveState();
}

function isLightColor(hex) {
  var r = parseInt(hex.slice(1,3),16);
  var g = parseInt(hex.slice(3,5),16);
  var b = parseInt(hex.slice(5,7),16);
  return (r * 0.299 + g * 0.587 + b * 0.114) > 160;
}

var openFontPopupId = null;

function toggleFontSizePopup(tile, tileEl, triggerEl) {
  var existing = document.getElementById('fontsize-popup-' + tile.id);
  if (existing) { existing.remove(); openFontPopupId = null; return; }
  if (openFontPopupId) {
    var prev = document.getElementById('fontsize-popup-' + openFontPopupId);
    if (prev) prev.remove();
  }
  openFontPopupId = tile.id;

  var popup = document.createElement('div');
  popup.className = 'font-size-popup';
  popup.id = 'fontsize-popup-' + tile.id;

  var current = tile.fontSize || 'md';
  [
    {key:'sm', label:'A', size:'11px'},
    {key:'md', label:'A', size:'13px'},
    {key:'lg', label:'A', size:'16px'},
  ].forEach(function(f) {
    var btn = document.createElement('button');
    btn.className = 'font-size-btn' + (current === f.key ? ' active' : '');
    btn.textContent = f.label;
    btn.style.fontSize = f.size;
    btn.title = f.key === 'sm' ? 'Small' : f.key === 'md' ? 'Medium' : 'Large';
    btn.onclick = function(e) {
      e.stopPropagation();
      tile.fontSize = f.key;
      var ws = currentWorkspace();
      if (ws.tileInstances[tile.id]) ws.tileInstances[tile.id].fontSize = f.key;
      saveState();
      popup.remove();
      openFontPopupId = null;
      renderCanvas();
    };
    popup.appendChild(btn);
  });

  var header = tileEl.querySelector('.tile-header');
  header.appendChild(popup);

  setTimeout(function() {
    document.addEventListener('click', function closePopup() {
      popup.remove();
      openFontPopupId = null;
      document.removeEventListener('click', closePopup);
    }, {once: true});
  }, 10);
}

function toggleCollapse(tile) {
  tile.collapsed = !tile.collapsed;

function makeRangeMap(nr, key) {
  // Build $.range_map for dot coloring
  // For metrics where LOW is bad (spo2, urine, albumin, egfr, pf_ratio)
  var lowBad = ['spo2','urine','albumin','egfr','pf_ratio'];
  var isLowBad = lowBad.indexOf(key) > -1;
  var lo = nr[0], hi = nr[1];
  var map = {};
  if (isLowBad) {
    // below lo = red, lo to max = green
    map[':' + (lo - 0.001)] = 'red';
    map[lo + ':'] = 'green';
  } else {
    // below lo = red, lo to hi = green, above hi = red
    map[':' + (lo - 0.001)] = 'red';
    map[lo + ':' + hi] = 'green';
    map[(hi + 0.001) + ':'] = 'red';
  }
  return $.range_map(map);
}

function initSparklines(series) {
  // Overview card sparklines
  Object.keys(OV_CARDS).forEach(function(cardId) {
    var card = OV_CARDS[cardId];
    card.metrics.forEach(function(m) {
      var vals = series[m.key];
      if (!vals) return;
      var nr = NORMAL[m.key];
      var rangeMap = nr ? makeRangeMap(nr, m.key) : null;
      var opts = {
        type:'line', width:'90', height:'28',
        lineColor:'#666', fillColor:false, lineWidth:1.2,
        spotRadius:3, spotColor:false, minSpotColor:false, maxSpotColor:false,
        highlightSpotColor:false, highlightLineColor:false,
        tooltipFormatter: function(sp, options, fields) {
          if (!fields || !fields[0] || fields[0].y === undefined) return '';
          var v = fields[0].y; var d = fields[0].offset + 1;
          var flag = nr && ((['spo2','urine','albumin','egfr','pf_ratio'].indexOf(m.key)>-1)?v<nr[0]:(v<nr[0]||v>nr[1])) ? ' !' : '';
          return '<span style="color:#fff">Day '+d+': <b>'+v.toFixed(m.dec)+'</b>'+flag+'</span>';
        }
      };
      if (nr) { opts.normalRangeMin=nr[0]; opts.normalRangeMax=nr[1]; opts.normalRangeColor='rgba(173,216,230,0.4)'; }
      if (rangeMap) opts.valueSpots = rangeMap;
      $('.spark-' + m.key).sparkline(vals, opts);
    });
  });

  // Custom panel sparklines (cp-sparkline class, explicit width per tile)
  document.querySelectorAll('.cp-sparkline[data-cp-key]').forEach(function(sp) {
    var key = sp.getAttribute('data-cp-key');
    var vals = series[key];
    if (!vals || !vals.length) return;
    var nrRaw = sp.getAttribute('data-cp-nr');
    var nr = nrRaw ? JSON.parse(nrRaw) : (NORMAL[key] || null);
    var color = sp.getAttribute('data-cp-color') || '#2980b9';
    var spW = parseInt(sp.getAttribute('data-cp-w')) || 80;
    var opts = {
      type:'line', width: spW, height: 24,
      lineColor: color,
      fillColor: false,
      lineWidth:1.5, spotRadius:2,
      spotColor:false, minSpotColor:false, maxSpotColor:false,
      highlightSpotColor:'#e74c3c', highlightLineColor:'#bbb',
      tooltipFormatter: function(sp2, options, fields) {
        return '<span style="color:#fff">Day '+(fields[0].offset+1)+': <b>'+fields[0].y+'</b></span>';
      }
    };
    if (nr) { opts.normalRangeMin=nr[0]; opts.normalRangeMax=nr[1]; opts.normalRangeColor='rgba(173,216,230,0.3)'; }
    try { $(sp).sparkline(vals, opts); } catch(e) {}
  });
  // Standalone sparkline-single tiles
  document.querySelectorAll('[data-sp-id]').forEach(function(spEl) {
    var key = spEl.getAttribute('data-sp-key');
    var tileId = spEl.getAttribute('data-sp-tile');
    var vals = series[key];
    if (!vals || !vals.length) return;
    var nr = NORMAL[key] || null;
    var spW = Math.max(80, spEl.parentElement.offsetWidth - 80);
    $(spEl).sparkline(vals, {
      type:'line', width: spW, height:'40',
      lineColor:'#5b8db8', fillColor:false,
      normalRangeMin: nr ? nr[0] : null,
      normalRangeMax: nr ? nr[1] : null,
      normalRangeColor:'rgba(100,200,150,0.12)',
      spotColor:false, minSpotColor:false, maxSpotColor:false,
      tooltipFormatter: function(sp2, options, fields) {
        if (!fields || !fields[0] || fields[0].y === undefined) return '';
        return 'Day ' + (fields[0].offset+1) + ': ' + fields[0].y.toFixed(2);
      }
    });
  });
}

// === DRAG AND DROP — COLUMN GRID ===
// =====================================================
function initDragging() {
  var canvas = document.getElementById('canvas');
  var tiles = canvas.querySelectorAll('[data-tile-id]');
  var topZ = 10;

  tiles.forEach(function(tileEl) {
    var handle = tileEl.querySelector('.tile-header') || tileEl.querySelector('.ov-card-header');
    if (!handle) return;

    handle.addEventListener('mousedown', function(e) {
      var t = e.target;
      if (t.tagName === 'BUTTON' || t.tagName === 'A' ||
          t.classList.contains('fmt-btn') ||
          t.classList.contains('tile-ctrl-btn') ||
          t.classList.contains('color-dot') ||
          t.classList.contains('promote-btn') ||
          t.classList.contains('color-swatch') ||
          t.classList.contains('font-size-btn') ||
          t.classList.contains('tab-close')) return;

      e.preventDefault();
      e.stopPropagation();

      topZ++;
      tileEl.style.zIndex = topZ;

      var tileId = tileEl.getAttribute('data-tile-id');
      var ws = currentWorkspace();
      var tileData = ws ? ws.tileInstances[tileId] : null;
      if (!tileData) return;

      var colSpan = tileData.colSpan || 1;
      var rowSpan = tileData.rowSpan || 4;
      var w = spanToW(colSpan);
      var h = tileData.collapsed ? 28 : spanToH(rowSpan);

      var initX = colToX(tileData.col || 0);
      var initY = rowToY(tileData.row || 0);
      var initMX = e.clientX;
      var initMY = e.clientY;

      // Show ghost
      var ghost = document.getElementById('ghost');
      if (ghost) {
        ghost.style.width = w + 'px';
        ghost.style.height = h + 'px';
        ghost.style.left = initX + 'px';
        ghost.style.top = initY + 'px';
        ghost.style.display = 'block';
      }

      tileEl.style.opacity = '0.65';

      var colLabel = document.getElementById('col-label');

      function onMove(e) {
        var rawX = Math.max(0, initX + (e.clientX - initMX));
        var rawY = Math.max(0, initY + (e.clientY - initMY));
        tileEl.style.left = rawX + 'px';
        tileEl.style.top = rawY + 'px';

        var snapCol = Math.min(xToCol(rawX), NUM_COLS - colSpan);
        var snapRow = yToRow(rawY);
        if (ghost) {
          ghost.style.left = colToX(snapCol) + 'px';
          ghost.style.top = rowToY(snapRow) + 'px';
        }
        if (colLabel) {
          colLabel.textContent = 'Col ' + (snapCol+1) + '  Row ' + (snapRow+1);
          colLabel.style.display = 'block';
        }

        checkTabDrop(e.clientX, e.clientY, tileEl);
      }

      function onUp(e) {
        tileEl.style.opacity = '';
        if (ghost) ghost.style.display = 'none';
        if (colLabel) colLabel.style.display = 'none';

        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);

        var rawX = parseInt(tileEl.style.left) || 0;
        var rawY = parseInt(tileEl.style.top) || 0;
        var finalCol = Math.min(xToCol(rawX), NUM_COLS - colSpan);
        var finalRow = yToRow(rawY);

        tileData.col = finalCol;
        tileData.row = finalRow;
        tileData._zIndex = topZ;

        tileEl.style.left = colToX(finalCol) + 'px';
        tileEl.style.top = rowToY(finalRow) + 'px';

        var dropped = finalTabDrop(e.clientX, e.clientY, tileId);
        if (dropped) { renderCanvas(); return; }

        drawPlaceholders();
        saveState();
      }

      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
    });
  });
}

function checkTabDrop(x, y, tile) {
  var tabBar = document.getElementById('view-tabs-bar');
  var rect = tabBar.getBoundingClientRect();
  if (y >= rect.top && y <= rect.bottom) {
    tabBar.style.background = '#eaf3fb';
  } else {
    tabBar.style.background = '#fff';
  }
}

function finalTabDrop(x, y, tileId) {
  var tabBar = document.getElementById('view-tabs-bar');
  tabBar.style.background = '#fff';
  var rect = tabBar.getBoundingClientRect();
  if (y < rect.top || y > rect.bottom) return false;

  // Find which tab was dropped on
  var ws = currentWorkspace();
  var tabs = ws.tabs;
  var tabEls = tabBar.querySelectorAll('.view-tab');
  var dropped = false;
  tabEls.forEach(function(tabEl, idx) {
    var tr = tabEl.getBoundingClientRect();
    if (x >= tr.left && x <= tr.right) {
      var targetTabId = ws.tabs.sort(function(a,b){return a.order-b.order;})[idx];
      if (targetTabId && targetTabId.id !== ws.currentTab) {
        if (ws.tileInstances[tileId]) {
          ws.tileInstances[tileId].tab = targetTabId.id;
          ws.tileInstances[tileId].col = 0;
          ws.tileInstances[tileId].row = 0;
          dropped = true;
        }
      }
    }
  });
  return dropped;
}

// =====================================================
// === TEMPLATE OPERATIONS ===
// =====================================================
function saveTemplate() {
  var name = prompt('Save this view as template:', 'My Template');
  if (!name) return;
  var ws = currentWorkspace();
  var tabId = ws.currentTab;
  var tiles = Object.values(ws.tileInstances).filter(function(t){return t.tab===tabId;});
  // Strip patient-specific data, keep structure
  var tmpl = {
    id: genId('tmpl'),
    name: name,
    author: currentUser,
    created: new Date().toISOString(),
    tiles: tiles.map(function(t) {
      var copy = JSON.parse(JSON.stringify(t));
      delete copy.pos; // positions are relative
      return copy;
    })
  };
  var saved = JSON.parse(localStorage.getItem('ehr-templates') || '{}');
  saved[tmpl.id] = tmpl;
  localStorage.setItem('ehr-templates', JSON.stringify(saved));

function loadTemplate(tmpl) {

  });
  tmpl.tiles.forEach(function(t) {
    var colSpan = t.colSpan || (t.type === 'hc-multi' || t.type === 'hc-single' ? 2 : 1);
    var rowSpan = t.rowSpan || (t.type === 'overview-card' ? 6 : 5);
    var pos = nextAvailablePos(colSpan);

    tile.colSpan = colSpan;
    tile.rowSpan = rowSpan;

  });

  hcCharts = {};
  renderCanvas();
}

function nlCompose() {
  var input = document.getElementById('nl-input').value.trim();
  if (!input) return;
  var status = document.getElementById('nl-status');
  status.textContent = 'Composing…';

  // Call Anthropic API
  fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: 'You are a clinical EHR view composer. Given a clinician\'s request, return ONLY valid JSON — an array of tile specs. No other text, no markdown.\n\nAvailable tile types and series keys:\nhc-single: spo2, rr, fio2, crp, ferritin, ddimer, ldh, wbc, creatinine, bun, urine, troponin, hr, sbp, temp, glucose, albumin, sodium, potassium, egfr, news2, sofa, pf_ratio, weight, magnesium, anion_gap\nhc-multi: array of above series keys\nspecial itemId: med_all, notes_md, notes_rn, pandemic-tile\n\nReturn format:\n[{"type":"hc-single","series":"creatinine","title":"Creatinine Trend","size":{"w":420,"h":220}},{"type":"hc-multi","series":["crp","ferritin"],"title":"Inflammatory Markers","size":{"w":520,"h":260}}]\n\nMatch the clinician\'s intent to the most relevant series. Always include a title. Return 1-4 tiles maximum.',
      messages: [{ role: 'user', content: input }]
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    status.textContent = '';
    var text = data.content && data.content[0] && data.content[0].text;
    if (!text) { status.textContent = 'No response'; return; }
    try {
      var clean = text.replace(/```json|```/g,'').trim();
      var tiles = JSON.parse(clean);
      if (!Array.isArray(tiles)) throw new Error('not array');
      var ws = currentWorkspace();
      tiles.forEach(function(t) {
        var colSpan = t.colSpan || 1;
        var rowSpan = t.rowSpan || 4;
        var pos = nextAvailablePos(colSpan);
        var newId = genId('ti');
        t.id = newId;
        t.tab = ws.currentTab;
        t.col = pos.col; t.row = pos.row;
        t.colSpan = colSpan; t.rowSpan = rowSpan;
        delete t.size; delete t.pos;
        ws.tileInstances[newId] = t;
      });
      saveState();
      document.getElementById('nl-input').value = '';
      hcCharts = {};
      renderCanvas();
      status.textContent = tiles.length + ' tile(s) added';
      setTimeout(function(){status.textContent='';}, 3000);
    } catch(e) {
      status.textContent = 'Could not parse response';
    }
  })
  .catch(function(err) {
    status.textContent = '';
    var lower = input.toLowerCase();
    var ws = currentWorkspace();
    var tilesToAdd = [];

    if (lower.indexOf('renal') > -1 || lower.indexOf('kidney') > -1 || lower.indexOf('creatinine') > -1) {
      tilesToAdd.push({type:'hc-multi', series:['creatinine','bun'], title:'Renal Function', colSpan:1, rowSpan:4});
      tilesToAdd.push({type:'hc-single', series:'urine', title:'Urine Output', colSpan:1, rowSpan:4});
    }
    if (lower.indexOf('inflam') > -1 || lower.indexOf('crp') > -1 || lower.indexOf('ferritin') > -1) {
      tilesToAdd.push({type:'hc-multi', series:['crp','ferritin','ddimer'], title:'Inflammatory Markers', colSpan:1, rowSpan:4});
    }
    if (lower.indexOf('resp') > -1 || lower.indexOf('oxygen') > -1 || lower.indexOf('spo2') > -1) {
      tilesToAdd.push({type:'hc-multi', series:['spo2','rr','fio2'], title:'Respiratory Status', colSpan:1, rowSpan:4});
    }
    if (lower.indexOf('med') > -1 || lower.indexOf('drug') > -1) {
      tilesToAdd.push({type:'special', itemId:'med_all', title:'Medications', colSpan:1, rowSpan:4});
    }
    if (lower.indexOf('pandemic') > -1 || lower.indexOf('context') > -1 || lower.indexOf('surge') > -1) {
      tilesToAdd.push({type:'pandemic-tile', title:'Pandemic Context', colSpan:1, rowSpan:4});
    }
    if (tilesToAdd.length === 0) {
      tilesToAdd.push({type:'hc-multi', series:['crp','creatinine','spo2'], title:'Overview Trends', colSpan:1, rowSpan:4});
    }

    tilesToAdd.forEach(function(t) {
      var pos = nextAvailablePos(t.colSpan || 1);
      var newId = genId('ti');
      t.id = newId;
      t.tab = ws.currentTab;
      t.col = pos.col; t.row = pos.row;
      ws.tileInstances[newId] = t;
    });
    saveState();
    document.getElementById('nl-input').value = '';
    hcCharts = {};
    renderCanvas();
    status.textContent = tilesToAdd.length + ' tile(s) added (keyword mode)';
    setTimeout(function(){status.textContent='';},3000);
  });
}

// Search input — live dropdown
document.getElementById('tb-search').addEventListener('input', function() {
  var q = this.value.toLowerCase().trim();
  var dd = document.getElementById('tb-dropdown');
  if (!q) { dd.style.display = 'none'; return; }

  // Collect all items from all categories
  var allItems = [];
  MENU_CATEGORIES.forEach(function(cat) {
    cat.items.forEach(function(item) {
      allItems.push(item);
    });
  });

  // Filter
  var matches = allItems.filter(function(item) {
    var code = item.loinc || item.rxnorm || '';
    return item.label.toLowerCase().indexOf(q) > -1 ||
           item.abbrev.toLowerCase().indexOf(q) > -1 ||
           code.toLowerCase().indexOf(q) > -1;
  }).slice(0, 12);

  dd.innerHTML = '';
  if (matches.length === 0) {
    dd.innerHTML = '<div style="padding:8px;font-size:11px;color:#bbb;">No matches</div>';
    dd.style.display = 'block';
    return;
  }

  matches.forEach(function(item, matchIdx) {
    var row = document.createElement('div');
    row.className = 'tb-dd-row';
    row.style.cssText = 'padding:5px 10px;cursor:pointer;border-bottom:1px solid #f5f5f5;display:flex;align-items:center;gap:6px;';
    // Auto-highlight first result
    if (matchIdx === 0) {
      row.classList.add('tb-dd-focused');
      row.style.background = '#eaf3fb';
    }
    row.onmouseenter = function(){ 
      dd.querySelectorAll('.tb-dd-focused').forEach(function(r){ r.classList.remove('tb-dd-focused'); r.style.background=''; });
      row.classList.add('tb-dd-focused');
      row.style.background='#eaf3fb'; 
    };
    row.onmouseleave = function(){ row.style.background= row.classList.contains('tb-dd-focused') ? '#eaf3fb' : ''; };

    var nameSpan = document.createElement('span');
    nameSpan.style.cssText = 'flex:1;font-size:11px;';
    nameSpan.textContent = item.label;

    var abbrevSpan = document.createElement('span');
    abbrevSpan.style.cssText = 'font-size:10px;color:#999;';
    abbrevSpan.textContent = item.abbrev;

    var codeSpan = document.createElement('span');
    var code = item.loinc || item.rxnorm;
    codeSpan.style.cssText = 'font-size:9px;font-family:monospace;color:#2980b9;';
    codeSpan.textContent = code ? (item.loinc ? 'L:' : 'Rx:') + code : '';

    row.appendChild(nameSpan);
    row.appendChild(abbrevSpan);
    row.appendChild(codeSpan);

    row.addEventListener('click', function() {
      tbAddItem(item);
      document.getElementById('tb-search').value = '';
      dd.style.display = 'none';
      dd.innerHTML = '';
      document.getElementById('tb-search').focus();
    });
    dd.appendChild(row);
  });
  dd.style.display = 'block';
});

// Close dropdown on outside click
document.addEventListener('click', function(e) {
  var dd = document.getElementById('tb-dropdown');
  if (dd && !dd.contains(e.target) && e.target.id !== 'tb-search') {
    dd.style.display = 'none';
  }
});

// Keyboard nav in dropdown
document.getElementById('tb-search').addEventListener('keydown', function(e) {
  var dd = document.getElementById('tb-dropdown');
  if (!dd || dd.style.display === 'none') return;
  var rows = dd.querySelectorAll('.tb-dd-row');
  if (!rows.length) return;
  var focused = dd.querySelector('.tb-dd-focused');
  var idx = -1;
  rows.forEach(function(r, i){ if (r === focused) idx = i; });

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (focused) { focused.classList.remove('tb-dd-focused'); focused.style.background = ''; }
    var next = rows[Math.min(idx + 1, rows.length - 1)];
    next.classList.add('tb-dd-focused'); next.style.background = '#eaf3fb';
    next.scrollIntoView({block:'nearest'});
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (focused) { focused.classList.remove('tb-dd-focused'); focused.style.background = ''; }
    var prev = rows[Math.max(idx - 1, 0)];
    prev.classList.add('tb-dd-focused'); prev.style.background = '#eaf3fb';
    prev.scrollIntoView({block:'nearest'});
  } else if (e.key === 'Enter') {
    e.preventDefault();
    var target = focused || rows[0];
    if (target) target.click();
  } else if (e.key === 'Escape') {
    dd.style.display = 'none';
    this.value = '';
  }
});

function tbAddItem(item) {
  // Avoid duplicates
  if (tbItems.find(function(x){ return x.id === item.id; })) return;
  tbItems.push(item);
  // Auto-set title if empty
  var titleEl = document.getElementById('tb-title');
  if (!titleEl.value && tbItems.length === 1) titleEl.value = item.label + ' Panel';
  if (tbItems.length === 2 && titleEl.value === tbItems[0].label + ' Panel') {
    titleEl.value = tbItems[0].abbrev + ' / ' + item.abbrev + ' Panel';
  }
  renderTbSelected();
  renderTbPreview();
}

function tbRemoveItem(id) {
  tbItems = tbItems.filter(function(x){ return x.id !== id; });
  renderTbSelected();
  renderTbPreview();
}

function renderTbSelected() {
  var container = document.getElementById('tb-selected');
  var countEl = document.getElementById('tb-count');
  countEl.textContent = '(' + tbItems.length + ')';
  container.innerHTML = '';
  if (tbItems.length === 0) {
    container.innerHTML = '<div style="font-size:11px;color:#bbb;padding:8px 0;font-style:italic;">Search above and click to add items</div>';
    return;
  }
  tbItems.forEach(function(item, idx) {
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;align-items:center;padding:4px 6px;border-radius:4px;margin-bottom:2px;background:#f8f8f6;border:1px solid #ececec;gap:6px;';

    // Drag handle
    var grip = document.createElement('span');
    grip.textContent = '⠿';
    grip.style.cssText = 'color:#ccc;cursor:grab;font-size:12px;flex-shrink:0;';
    row.appendChild(grip);

    var nameSpan = document.createElement('span');
    nameSpan.style.cssText = 'flex:1;font-size:11px;';
    nameSpan.textContent = item.label;
    row.appendChild(nameSpan);

    var abbrevSpan = document.createElement('span');
    abbrevSpan.style.cssText = 'font-size:10px;color:#999;';
    abbrevSpan.textContent = item.abbrev;
    row.appendChild(abbrevSpan);

    var code = item.loinc || item.rxnorm;
    if (code) {
      var codeSpan = document.createElement('span');
      codeSpan.style.cssText = 'font-size:9px;font-family:monospace;color:#2980b9;';
      codeSpan.textContent = (item.loinc ? 'L:' : 'Rx:') + code;
      row.appendChild(codeSpan);
    }

    // Move up/down
    var upBtn = document.createElement('button');
    upBtn.textContent = '↑'; upBtn.type = 'button';
    upBtn.style.cssText = 'background:none;border:none;cursor:pointer;color:#bbb;font-size:11px;padding:0 2px;';
    upBtn.onclick = function(e){ e.stopPropagation(); if(idx>0){var t=tbItems[idx];tbItems[idx]=tbItems[idx-1];tbItems[idx-1]=t;renderTbSelected();renderTbPreview();} };
    row.appendChild(upBtn);

    var downBtn = document.createElement('button');
    downBtn.textContent = '↓'; downBtn.type = 'button';
    downBtn.style.cssText = 'background:none;border:none;cursor:pointer;color:#bbb;font-size:11px;padding:0 2px;';
    downBtn.onclick = function(e){ e.stopPropagation(); if(idx<tbItems.length-1){var t=tbItems[idx];tbItems[idx]=tbItems[idx+1];tbItems[idx+1]=t;renderTbSelected();renderTbPreview();} };
    row.appendChild(downBtn);

    var delBtn = document.createElement('button');
    delBtn.textContent = '×'; delBtn.type = 'button';
    delBtn.style.cssText = 'background:none;border:none;cursor:pointer;color:#ccc;font-size:14px;padding:0 2px;line-height:1;';
    delBtn.onmouseenter = function(){ delBtn.style.color='#e74c3c'; };
    delBtn.onmouseleave = function(){ delBtn.style.color='#ccc'; };
    (function(id){ delBtn.onclick = function(e){ e.stopPropagation(); tbRemoveItem(id); }; })(item.id);
    row.appendChild(delBtn);

    container.appendChild(row);
  });
}

function renderTbPreview() {
  var preview = document.getElementById('tb-preview');
  var fmt = document.getElementById('tb-format').value;
  preview.innerHTML = '';

  if (tbItems.length === 0) {
    preview.innerHTML = '<div style="color:#bbb;font-size:11px;margin-top:40px;">Add items on the left to preview</div>';
    return;
  }

  var pt = PATIENTS[appState ? appState.currentPatient : 'pt:JM'];
  var series = pt ? pt.series : SERIES;

  // Build a mini preview tile
  var previewCard = document.createElement('div');
  previewCard.style.cssText = 'background:#fff;border:1px solid #ddd;border-radius:6px;min-width:260px;max-width:340px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.08);';

  var header = document.createElement('div');
  var titleVal = document.getElementById('tb-title').value || 'Custom Panel';
  header.style.cssText = 'background:#e8e8e4;padding:6px 10px;font-size:11px;font-weight:700;color:#444;border-bottom:1px solid #ddd;';
  header.textContent = titleVal;
  previewCard.appendChild(header);

  if (fmt === 'sparkline-panel' || fmt === 'table-multi') {
    tbItems.forEach(function(item) {
      var row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;padding:4px 8px;border-bottom:1px solid #f5f5f5;gap:6px;';

      var label = document.createElement('span');
      label.style.cssText = 'font-size:10px;color:#666;width:80px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
      label.title = item.label;
      label.textContent = item.abbrev;
      row.appendChild(label);

      if (fmt === 'sparkline-panel') {
        var spWrap = document.createElement('span');
        spWrap.className = 'sparkline';
        var vals = (series[item.id] || []).slice(-14);
        var nr = item.normalRange;
        spWrap.setAttribute('data-values', JSON.stringify(vals));
        spWrap.setAttribute('data-nr', nr ? JSON.stringify(nr) : 'null');
        spWrap.style.cssText = 'flex:1;display:inline-block;';
        row.appendChild(spWrap);

        if (vals.length > 0) {
          var last = vals[vals.length-1];
          var valSpan = document.createElement('span');
          var isAbn = nr && (last < nr[0] || last > nr[1]);
          valSpan.style.cssText = 'font-size:12px;font-weight:600;color:' + (isAbn?'#c0392b':'#27ae60') + ';width:52px;text-align:right;flex-shrink:0;';
          valSpan.textContent = last.toFixed(1) + (item.unit ? ' ' + item.unit : '');
          row.appendChild(valSpan);
        }
      } else {
        // Table format
        var vals = (series[item.id] || []);
        var last = vals.length > 0 ? vals[vals.length-1] : '—';
        var prev = vals.length > 1 ? vals[vals.length-2] : null;
        var nr = item.normalRange;
        var isAbn = nr && typeof last === 'number' && (last < nr[0] || last > nr[1]);
        var valSpan = document.createElement('span');
        valSpan.style.cssText = 'font-size:12px;font-weight:600;flex:1;text-align:right;color:' + (isAbn?'#c0392b':'#27ae60') + ';';
        valSpan.textContent = (typeof last === 'number' ? last.toFixed(1) : last) + (item.unit ? ' ' + item.unit : '');
        if (prev !== null) {
          var diff = last - prev;
          valSpan.textContent += diff > 0.01 ? ' ↑' : diff < -0.01 ? ' ↓' : '';
        }
        row.appendChild(valSpan);
      }
      previewCard.appendChild(row);
    });

    // Init sparklines after DOM insert
    if (fmt === 'sparkline-panel') {
      setTimeout(function() {
        previewCard.querySelectorAll('.sparkline').forEach(function(sp) {
          var vals = JSON.parse(sp.getAttribute('data-values') || '[]');
          var nr = JSON.parse(sp.getAttribute('data-nr') || 'null');
          if (!vals.length) return;
          var opts = {
            type:'line', width:'100%', height:24,
            lineColor:'#2980b9', fillColor:'rgba(41,128,185,0.08)',
            spotRadius:2, minSpotColor:false, maxSpotColor:false,
            highlightSpotColor:'#e74c3c', highlightLineColor:'#bbb',
            normalRangeMin: nr ? nr[0] : undefined,
            normalRangeMax: nr ? nr[1] : undefined,
            normalRangeColor:'rgba(173,216,230,0.3)',
            tooltipFormatter: function(sp, opts, fields) {
              return 'Day ' + (fields[0].offset+1) + ': ' + fields[0].value;
            }
          };
          try { $(sp).sparkline(vals, opts); } catch(e) {}
        });
      }, 60);
    }
  } else if (fmt === 'hc-multi') {
    // Mini Highcharts preview
    var chartDiv = document.createElement('div');
    chartDiv.id = 'tb-preview-chart';
    chartDiv.style.cssText = 'width:320px;height:180px;padding:4px;';
    previewCard.appendChild(chartDiv);
    setTimeout(function(){
      if (typeof Highcharts === 'undefined') return;
      var colors = ['#2980b9','#c0392b','#27ae60','#e67e22','#8e44ad','#16a085'];
      var hcSeries = tbItems.map(function(item, idx) {
        var vals = (series[item.id] || []).map(function(v,i){ return [i,v]; });
        return {name: item.abbrev, data: vals, color: colors[idx % colors.length], lineWidth:1.5};
      });
      Highcharts.chart('tb-preview-chart', {
        chart:{type:'line',animation:false,margin:[20,10,20,40],style:{fontFamily:'Arial,sans-serif'},height:180},
        title:{text:null}, legend:{enabled:tbItems.length>1,itemStyle:{fontSize:'9px'},margin:4},
        xAxis:{visible:false}, yAxis:{title:{text:null},labels:{style:{fontSize:'9px'}}},
        tooltip:{shared:true,outside:true,style:{fontSize:'10px'}},
        credits:{enabled:false}, series: hcSeries
      });
    }, 60);
  }

  preview.appendChild(previewCard);
}

function insertBuiltTile() {
  if (tbItems.length === 0) {
    alert('Add at least one item to the tile first.');
    return;
  }
  var ws = currentWorkspace();
  var title = document.getElementById('tb-title').value.trim() || 'Custom Panel';
  var fmt = document.getElementById('tb-format').value;
  var colSpan = parseInt(document.getElementById('tb-colspan').value) || 2;
  var rowSpan = fmt === 'hc-multi' ? 6 : Math.max(2, Math.ceil((tbItems.length * 30 + 28) / (ROW_H + ROW_GAP)));

  var pos = nextAvailablePos(colSpan);
  var tileId = genId('ti');
  var tile = {
    id: tileId,
    tab: ws.currentTab,
    type: fmt === 'hc-multi' ? 'hc-multi'
        : fmt === 'table-multi' ? 'custom-panel-table'
        : 'custom-panel',
    series: tbItems.map(function(x){ return x.id; }),
    items: tbItems.map(function(x){ return {id:x.id, label:x.label, abbrev:x.abbrev, unit:x.unit||'', normalRange:x.normalRange||null, loinc:x.loinc||null, rxnorm:x.rxnorm||null}; }),
    title: title,
    col: pos.col, row: pos.row,
    colSpan: colSpan, rowSpan: rowSpan
  };
  ws.tileInstances[tileId] = tile;
  saveState();
  closeTileBuilder();
  renderCanvas();
  flashTile(tileId);
  showToast('Inserted: ' + title);
}

window.addEventListener('resize', function() {
  if (currentUser && appState) {
    computeGrid();
    renderCanvas();
  }
});

function setColumns(n) {
  NUM_COLS = n;
  document.querySelectorAll('.col-sel-btn').forEach(function(b){ b.classList.remove('active'); });
  var btn = document.getElementById('col-btn-' + n);
  if (btn) btn.classList.add('active');
  computeGrid();
  renderCanvas();
}

</script>
</body>
</html>
